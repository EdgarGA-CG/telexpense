name: Test TELEXPENSE_TOKEN secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret is set
        env:
          TOKEN: ${{ secrets.TELEXPENSE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: TELEXPENSE_TOKEN is empty or not set"
            exit 1
          else
            echo "OK: TELEXPENSE_TOKEN is set (length: ${#TOKEN})"
          fi
